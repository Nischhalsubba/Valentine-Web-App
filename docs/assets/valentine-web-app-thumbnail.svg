      <text x="18" y="28" fill="#a63f5a" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">MEMORY</text>
      <rect x="18" y="42" width="114" height="8" rx="4" fill="#ffd3da"/>
      <rect x="18" y="58" width="92" height="8" rx="4" fill="#f0e6de"/>
    </g>
    <g transform="translate(222 326)">
      <rect width="150" height="92" rx="16" fill="#fff7ef" stroke="#f0e6de"/>
      <text x="18" y="28" fill="#a63f5a" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">QUIZ</text>
      <circle cx="28" cy="58" r="7" fill="#2f8f5b"/>
      <rect x="44" y="54" width="86" height="8" rx="4" fill="#f0e6de"/>
