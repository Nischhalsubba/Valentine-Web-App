  <text x="1128" y="596" text-anchor="end" fill="#a63f5a" opacity="0.7" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3">NISCHHALSUBBA / VALENTINE-WEB-APP</text>
