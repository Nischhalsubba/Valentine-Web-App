      <g transform="translate(0 30)" fill="#ffd3da">
        <circle cx="7" cy="7" r="7"/><circle cx="53" cy="7" r="7"/><circle cx="99" cy="7" r="7"/><circle cx="145" cy="7" r="7"/>
        <circle cx="191" cy="7" r="7"/><circle cx="237" cy="7" r="7"/><circle cx="283" cy="7" r="7"/><circle cx="329" cy="7" r="7"/>
      </g>
      <g transform="translate(0 30)" fill="#e85d75">
        <circle cx="7" cy="7" r="7"/><circle cx="53" cy="7" r="7"/><circle cx="99" cy="7" r="7"/><circle cx="145" cy="7" r="7"/>
      </g>
    </g>

    <g transform="translate(70 118)">
      <rect width="280" height="178" rx="18" fill="#fff7ef" stroke="#f0e6de"/>
      <path d="M30 48h220v100H30z" fill="#ffffff" stroke="#e8c8cf"/>
      <path d="M30 48l110 73L250 48" fill="#ffd3da" stroke="#e85d75" stroke-width="3"/>
      <path d="M30 148l84-65M250 148l-84-65" fill="none" stroke="#e8c8cf" stroke-width="3"/>
